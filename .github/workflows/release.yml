name: Build & Release

on:
  push:
    tags:
      - 'v*'          # 推送 v0.1.0 之类的 tag 时触发
  workflow_dispatch:  # 也允许在 Actions 页面手动触发

permissions:
  contents: write     # 允许创建 Release 并上传产物

jobs:
  macos:
    runs-on: macos-14   # Apple Silicon (arm64)

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'    # 图标为预烘焙着色 SVG，无需 6.10 的 currentColor
          arch: 'clang_64'
          modules: ''

      - name: 配置与编译
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$Qt6_DIR"
          cmake --build build -j$(sysctl -n hw.ncpu)

      - name: 打包 DMG
        run: |
          # macdeployqt 会把依赖的 Qt 框架拷进 .app，使其可在无 Qt 的机器上运行
          macdeployqt build/bin/dsh-plugin-manager.app -qmldir=src/ui/qml

          # 关键：macdeployqt 留下的 linker ad-hoc 签名不完整（资源未封装），
          # Apple Silicon 上会被系统判为"已损坏"。重新对整个 bundle 完整签名：
          codesign --force --deep --sign - --timestamp=none build/bin/dsh-plugin-manager.app
          # 验证签名完整性（Sealed Resources 必须有文件数）
          codesign -dv --verbose=2 build/bin/dsh-plugin-manager.app 2>&1 | grep -E "Signature|Sealed"

          # 手动创建 DMG（macdeployqt -dmg 会拿构建路径当卷名，显示为
          # "build:bin:dsh-plugin-manager"，很难看）。改用 hdiutil：
          #   - 卷名 "DSH Plugin Manager"
          #   - 内置 /Applications 快捷方式，用户拖拽即完成安装
          mkdir -p dmg-staging
          cp -R build/bin/dsh-plugin-manager.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "DSH Plugin Manager" \
                         -srcfolder dmg-staging \
                         -ov -format UDZO \
                         dsh-plugin-manager-macos-arm64.dmg
          rm -rf dmg-staging
          ls -lh dsh-plugin-manager-macos-arm64.dmg

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-plugin-manager-macos-arm64.dmg
          generate_release_notes: true
